{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}АНО «Общественный Комитет»{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.svg' %}">

  <!-- Шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Основные стили -->
   <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v=2">
</head>
<body>
  <!-- ПРЕЛОАДЕР -->
  <div id="preloader">
    <div class="preloader-content">
      <img src="{% static 'img/logo.svg' %}" alt="Логотип" class="preloader-logo">
    </div>
  </div>



  <!-- Шапка сайта -->
  {% include 'includes/header.html' %}

  <!-- Основной контент (с отступами) -->
  <main class="site-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Подвал сайта -->
  {% include 'includes/footer.html' %}

  <!-- Модальное окно согласия -->
  {% include 'includes/consent_modal.html' %}

  <!-- Скрипты -->
  <script src="{% static 'js/form_validation.js' %}"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.querySelector('.custom-file-upload input[type="file"]');
    const fileNameDisplay = document.querySelector('.file-name');

    if (fileInput && fileNameDisplay) {
      fileInput.addEventListener('change', function() {
        const count = fileInput.files.length;
        if (count > 0) {
          if (count === 1) {
            fileNameDisplay.textContent = fileInput.files[0].name;
          } else {
            fileNameDisplay.textContent = `Выбрано файлов: ${count}`;
          }
          fileNameDisplay.style.color = 'var(--primary)';
          fileNameDisplay.style.fontWeight = '600';
        } else {
          fileNameDisplay.textContent = 'Файлы не выбраны';
          fileNameDisplay.style.color = 'var(--text-muted)';
          fileNameDisplay.style.fontWeight = 'normal';
        }
      });
    }
  });
</script>
  <!-- ЯНДЕКС МЕТРИКА -->
  {% if YM_ID %}
  <script type="text/javascript">
      (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
      (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

      ym({{ YM_ID }}, "init", {
          clickmap:true,
          trackLinks:true,
          accurateTrackBounce:true,
          webvisor:true
      });
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/{{ YM_ID }}" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  {% endif %}

  <!-- ... другие скрипты ... -->

  <!-- Подключаем Cookie-баннер -->
  {% include 'includes/cookie_banner.html' %}

  <!-- Логика работы Cookie-баннера -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const banner = document.getElementById('cookie-banner');
    const acceptBtn = document.getElementById('cookie-accept');

    if (!banner) return;

    // Принудительно показываем баннер при загрузке (для теста)
    banner.style.display = 'flex';

    if (acceptBtn) {
      acceptBtn.addEventListener('click', function() {
        banner.style.display = 'none';
      });
    }
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          const headerHeight = 80;
          const elementPosition = targetElement.getBoundingClientRect().top;
          const offsetPosition = elementPosition + window.pageYOffset - headerHeight;
          window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
        }
      });
    });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('consent-modal');
    const closeBtn = document.getElementById('close-consent-modal');

    if (!modal) {
      console.log('Ошибка: модальное окно не найдено в HTML');
      return;
    }

    // Открытие окна при клике на любую ссылку с классом open-consent
    document.querySelectorAll('.open-consent').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault(); // Отменяем переход по ссылке
        modal.style.display = 'flex'; // Показываем окно
      });
    });

    // Закрытие по крестику
    if (closeBtn) {
      closeBtn.addEventListener('click', function() {
        modal.style.display = 'none';
      });
    }

    // Закрытие по клику на темный фон
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const logoBlock = document.querySelector('.reveal-logo');

    if (logoBlock) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            // Когда блок виден на экране (скроллим вниз) — показываем логотип
            logoBlock.classList.add('active');
          } else {
            // Когда блок уходит с экрана (скроллим вверх) — прячем логотип
            logoBlock.classList.remove('active');
          }
        });
      }, { threshold: 0.1 }); // Срабатывает, как только покажется 10% карточки

      // Включаем слежку (и не выключаем её!)
      observer.observe(logoBlock);
    }
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Ищем блок с ошибками (красный текст)
    const hasErrors = document.querySelector('.form-group div[style*="color: #E53E3E"]');

    // Если ошибки есть — скроллим к форме
    if (hasErrors) {
      const formSection = document.getElementById('appeal');
      if (formSection) {
        // Небольшая задержка, чтобы страница успела прогрузиться
        setTimeout(() => {
          formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    }
  });
</script>
<script>
  window.addEventListener('load', function() {
    const preloader = document.getElementById('preloader');
    if (preloader) {
      // Задержка в 1.5 секунды, чтобы пользователь успел увидеть анимацию логотипа
      setTimeout(() => {
        preloader.classList.add('hidden');
      }, 1500);
    }
  });
</script>

</body>
</html>
